# Runs on every push to main and every pull request. Four jobs, kept separate: a leak is not a
# reason to stop reporting a broken test, nor the reverse, so a red check names what broke. The
# tests run on macOS alone, the one system the daemon supports; lint and types run on Linux, which
# claims no support.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Sensitive-data scan
    runs-on: ubuntu-latest
    steps:
      # Full history: the scan diffs against a base commit, which a shallow clone does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The refs arrive through the environment, never interpolated into the script: a branch name
      # on a pull request from a fork is attacker-controlled text.
      - name: Scan the pushed changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            git diff "origin/$BASE_REF...HEAD"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff "$BEFORE..$SHA"
          else
            git show "$SHA"
          fi | bash .github/scripts/scan-sensitive-diff.sh

  check:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 26 is the release line of the package's floor (`engines` in package.json).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Reports rather than rewrites: CI never edits the code under review.
      - run: npm run lint
      # The tests run from the sources with the types stripped, so a type error survives a green
      # suite (the `systems` job below).
      - run: npm run typecheck

  # The unit tests, on macOS alone. They start no Claude Code process and open no connection.
  systems:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      # The shell app, signed ad hoc (no identity, no team): built from the package beside it.
      - run: xcodebuild -project app/Pardner.xcodeproj -scheme Pardner -configuration Release -derivedDataPath "$RUNNER_TEMP/derived" build
      # The app pairs nothing without its protocol script, which a build phase joins into the bundle.
      - run: test -s "$RUNNER_TEMP/derived/Build/Products/Release/Pardner.app/Contents/Resources/protocol.js"

  # The app's floor is macOS 15, and the split view's setup order (the autosave name set before the items are added) is not documented by
  # Apple: the tests that drive it run there, as well as on the latest runner above. No Node: the split's tests need none of the scripts.
  app-macos-15:
    name: App on macOS 15
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The floor is the system the app runs on, not the compiler: the image's default Xcode (16.4) fails to compile the package
      # (sendability and actor-isolation checks), so the job builds with the image's Xcode 26.3, a 26.x Xcode as on the macOS 26 runner.
      - run: cd app && perl -e 'alarm 900; exec @ARGV' swift test --filter 'ScreensTests/(testAFirstLaunch|testADragged|testTheFirstThread|testAPanel|testTheSplitItems|testEachFirstLaunch|testThePanelsDefault)'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
